<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Azərbaycan Krossvord Oyunu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1 id="app-title"></h1>
      <div class="header-controls">
        <span id="current-level-title" class="current-level-title"></span>
        <button type="button" id="levels-toggle-btn" class="levels-toggle-btn"></button>
      </div>
    </header>

    <section id="levels-panel" class="levels-panel" hidden></section>

    <div id="completion-banner" class="completion-banner" role="status" aria-live="polite">
      <span id="completion-message"></span>
      <button type="button" id="next-level-btn" class="next-level-btn" hidden></button>
    </div>

    <div id="clue-bar" class="clue-bar">
      <button type="button" id="clue-prev-btn" class="clue-nav-btn">‹</button>
      <div id="clue-text" class="clue-text" aria-live="polite"></div>
      <button type="button" id="clue-next-btn" class="clue-nav-btn">›</button>
    </div>

    <main class="grid-wrapper">
      <div id="grid" class="crossword-grid" role="grid" tabindex="0"></div>
    </main>

    <div class="helpers-container">
      <div class="helpers-buttons">
        <button type="button" id="check-btn" class="helper-btn"></button>
        <button type="button" id="reveal-letter-btn" class="helper-btn"></button>
        <button type="button" id="reveal-word-btn" class="helper-btn"></button>
        <button type="button" id="reset-btn" class="helper-btn"></button>
      </div>
      <div id="helpers-status" class="helpers-status" role="status" aria-live="polite"></div>
    </div>

    <section class="clues-container">
      <div class="clues-section">
        <h2 id="across-heading"></h2>
        <ul id="across-clues" class="clue-list"></ul>
      </div>
      <div class="clues-section">
        <h2 id="down-heading"></h2>
        <ul id="down-clues" class="clue-list"></ul>
      </div>
    </section>

    <div id="keyboard" class="virtual-keyboard"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
